# Publishes the crate to crates.io. Called by release.yml after the GitHub
# Release exists. Needs the CARGO_REGISTRY_TOKEN secret; skipped without it.
name: publish-crates
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
jobs:
  crates-io:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping crates.io"
      - if: env.CARGO_REGISTRY_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CARGO_REGISTRY_TOKEN != ''
        uses: dtolnay/rust-toolchain@stable
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
