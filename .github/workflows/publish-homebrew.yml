# Pushes Formula/tbard.rb to abelland-lgtm/homebrew-tap. The formula is the
# one dist generates (a release asset) plus mpv and ffmpeg as dependencies,
# which dist cannot declare. Needs the HOMEBREW_TAP_TOKEN secret.
name: publish-homebrew
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
jobs:
  homebrew:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping Homebrew"
      - if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: abelland-lgtm/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          mkdir -p Formula
          curl -fsSL -o Formula/tbard.rb "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/tbard.rb"
          sed -i '0,/^  version "\(.*\)"$/s//  version "\1"\n  depends_on "ffmpeg"\n  depends_on "mpv"/' Formula/tbard.rb
          grep -q 'depends_on "mpv"' Formula/tbard.rb
          git config user.name "tbard release bot"
          git config user.email "noreply@github.com"
          git add Formula/tbard.rb
          git commit -m "tbard ${TAG#v}" && git push || echo "formula unchanged"
