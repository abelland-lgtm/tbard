[package]
name = "tbard"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["Abelland"]
license = "GPL-3.0-or-later"
description = "Audiobook manager and listener for the terminal: your Audible library, chapter-split downloads, playback with mpv and position sync"
repository = "https://github.com/abelland-lgtm/tbard"
homepage = "https://abelland-lgtm.github.io/tbard/"
readme = "README.md"
keywords = ["audible", "audiobooks", "tui", "terminal", "mpv"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["/examples", "/nix", "/noctalia", "/packaging", "/.github", "/flake.*", "/.envrc"]

[package.metadata.wix]
upgrade-guid = "DCD5D99C-36BA-4E6A-BF2A-F53B063DD08F"
path-guid = "FA109C7E-C1D1-4B48-85A5-B377D9209DC4"
license = false
eula = false

[dependencies]
aes = "0.9.3"
aes-gcm = "0.11.1"
anyhow = "1.0.104"
base64 = "0.23.1"
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.34"
fuzzy-matcher = "0.3.7"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
keyring = "4.2.0"
open = "5.4.4"
rand = "0.10.3"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "query", "form"] }
rsa = { version = "0.9.10", features = ["sha2", "getrandom"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util", "fs", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
tui-big-text = "0.8.10"
url = "2.5.8"

[features]
# Demo library for screenshots (`TBARD_DEMO=1`); never enabled in releases.
demo = []

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
