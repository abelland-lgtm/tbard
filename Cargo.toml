[package]
name = "tbard"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
publish = false

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
base64 = "0.23.1"
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hex = "0.4.3"
open = "5.4.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "query", "form"] }
rsa = { version = "0.9.10", features = ["sha2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util", "fs", "signal"] }
url = "2.5.8"
